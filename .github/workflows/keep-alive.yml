name: Mantener Supabase Activo

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 12:00 UTC
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite probarlo manualmente cuando quieras

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta a la API de Supabase
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2dXl6anduaXhidmF2YnZtemN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTIxNDUsImV4cCI6MjEwMjI4ODE0NX0.vUFy8IvWRyrn6t0360WHKRurnIxaykwdDcOePBTOjnU" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh2dXl6anduaXhidmF2YnZtemN0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MTIxNDUsImV4cCI6MjEwMjI4ODE0NX0.vUFy8IvWRyrn6t0360WHKRurnIxaykwdDcOePBTOjnU" \
            "https://xvuyzjwnixbvavbvmzct.supabase.co/rest/v1/operaciones?select=id_operacion&limit=1")
          
          echo "Respuesta HTTP de Supabase: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 206 ]; then
            echo "Ping exitoso. El contador de inactividad fue reseteado."
          else
            echo "Aviso: Supabase devolvió código $HTTP_STATUS"
          fi
